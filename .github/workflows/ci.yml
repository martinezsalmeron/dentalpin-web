name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build web
        run: pnpm --filter @dentalpin/web build
        env:
          PUBLIC_SITE_URL: https://www.dentalpin.com
          RESEND_API_KEY: dummy_for_build
          CONTACT_TO_EMAIL: ventas@dentalpin.com

      - name: Build docs
        run: pnpm --filter @dentalpin/docs build
        env:
          PUBLIC_SITE_URL: https://docs.dentalpin.com

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: dentalpin-web:ci
      - name: Build docs image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docs/Dockerfile
          push: false
          tags: dentalpin-docs:ci
