services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: dentalpin-web:local
    ports:
      - "4321:4321"
    env_file:
      - apps/web/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4321/"]
      interval: 30s
      timeout: 5s
      retries: 3

  docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
    image: dentalpin-docs:local
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
