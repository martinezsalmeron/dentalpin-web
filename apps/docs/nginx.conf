server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # Security-first defaults. Traefik in Coolify terminates TLS,
  # so these headers live on HTTPS responses downstream.
  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Compression. Traefik can also compress; Nginx handles anything cached in-layer.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    application/javascript
    application/json
    application/xml
    application/xml+rss
    application/wasm
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml
    font/woff
    font/woff2;

  # Astro emits fingerprinted assets under /_astro/ — cache aggressively.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    access_log off;
    try_files $uri =404;
  }

  location ~* \.(woff2?|ttf|otf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    access_log off;
    try_files $uri =404;
  }

  location ~* \.(png|jpg|jpeg|gif|webp|avif|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public" always;
    try_files $uri =404;
  }

  # Starlight / Astro route resolution: prefer exact file, then dir/index.html.
  location / {
    try_files $uri $uri/ $uri.html $uri/index.html =404;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
  }

  error_page 404 /404.html;
  location = /404.html { internal; }
}
